services:
  postgres:
    image: postgres:17-alpine
    container_name: pokertunity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokertunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokertunity}
      POSTGRES_DB: pokertunity
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A named volume, which Docker owns and keeps. Docker Desktop on WSL2
      # restarts this container before the distro's files are shared with it, so
      # a bind mount into the checkout comes back as a silent empty directory and
      # a fresh cluster on every reboot.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pokertunity -d pokertunity']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
