name: CI

# Pull requests and main. A branch gets checked once it is proposed, which is
# when a red tick tells somebody something they are waiting for.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push supersedes the first, because the newest code is what will
  # merge.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The ledger suite runs against the real thing. It charges seats, settles
    # matches and credits deposits through the real transactions, so it gets a
    # real Postgres and the money paths get tested. Same major as docker-compose,
    # so a migration that applies here applies in development and on deploy.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pokertunity
          POSTGRES_PASSWORD: pokertunity
          POSTGRES_DB: pokertunity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pokertunity -d pokertunity_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Named for what it is on purpose: the suite truncates every table between
      # tests and accepts a database whose name ends in _test.
      TEST_DATABASE_URL: postgres://pokertunity:pokertunity@localhost:5432/pokertunity_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      # Reads the version out of package.json's `packageManager`, so the runner
      # and a developer's machine resolve against the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tracked node_modules holds symlinks to one developer's absolute paths,
      # so every `pnpm install` rewrites them and every commit carries the noise.
      # .gitignore covers untracked files, so this step covers the tracked ones.
      - name: Dependencies stay untracked
        run: |
          if git ls-files | grep -E '(^|/)node_modules/'; then
            echo "::error::A node_modules tree is tracked. Untrack it: git rm -r --cached <path>"
            exit 1
          fi

      - run: pnpm lint

      # Ahead of the tests: the suite expects the schema to already be there, and a
      # migration that fails says so as itself.
      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: pnpm test

      # The same placeholder the Dockerfile uses. Next evaluates every route
      # module to collect page data and the database client needs a connection
      # string to load, and the build connects to nothing. The placeholder here
      # makes that a claim CI checks for the Dockerfile.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5/build

      # After the build. Next generates the route, page and layout types into
      # .next/types during a build, and tsc reads RouteContext from there for every
      # dynamic route in the app.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # forge-std is a submodule, and it is forge's test harness.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      # forge directly, the same command `pnpm test:contracts` runs: the contracts
      # stand apart from the Node workspace, and skipping its install saves a minute
      # on every run.
      - name: forge test
        run: forge test -vv
        working-directory: contracts
