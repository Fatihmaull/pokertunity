packages:
  - packages/*

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# drizzle-kit still pulls @esbuild-kit/core-utils, which pins an esbuild with
# GHSA-67mh-4wv8-2f99. That advisory is in esbuild's dev server, which stays
# idle here, and the Docker image ships devDependencies, so a clean audit saves
# every reader a re-judgement. The loader calls transform, which is the same API
# on the patched line.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
